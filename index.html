<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Starlight Drift</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#dfe6f3;--ink:#1b2440;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#070b18;--ink:#b9c4e6}}
:root[data-theme="dark"]{--bg:#070b18;--ink:#b9c4e6}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;overflow:hidden;touch-action:none}
#game{flex:1;min-height:0}
#hint{margin:0;padding:6px 12px 8px;text-align:center;font-size:13px}
</style>
</head>
<body>
<div id="game"></div>
<p id="hint">Move: arrows, WASD or drag. Dash: Space or the Dash button. Dash into bosses to hurt them. P pauses, M mutes.</p>
<script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.80.1/phaser.min.js"></script>
<script>
const W = 600, H = 800, FONT = 'system-ui, -apple-system, "Segoe UI", sans-serif';
const NOTES = [262, 330, 392, 330, 294, 370, 440, 370];
let AC = null, muted = false;

function loadBest() { try { return +localStorage.getItem('sd-best') || 0; } catch (e) { return 0; } }
function saveBest(v) { try { localStorage.setItem('sd-best', v); } catch (e) {} }
function loadTop() { try { return JSON.parse(localStorage.getItem('sd-top')) || []; } catch (e) { return []; } }
function addTop(s) { const t = loadTop().concat(s).sort((a, b) => b - a).slice(0, 5); try { localStorage.setItem('sd-top', JSON.stringify(t)); } catch (e) {} return t.indexOf(s) + 1; }

/* Tiny WebAudio synth: every sound effect is generated, no audio files. */
function sfx(f, d = 0.12, type = 'sine', slide = 0, vol = 0.07) {
  if (muted) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
    const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + d);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g).connect(AC.destination); o.start(); o.stop(t + d);
  } catch (e) {}
}

function spikes(cx, cy, n, outer, inner) {
  const pts = [];
  for (let i = 0; i < n * 2; i++) {
    const r = i % 2 ? inner : outer, a = (Math.PI / n) * i - Math.PI / 2;
    pts.push({ x: cx + Math.cos(a) * r, y: cy + Math.sin(a) * r });
  }
  return pts;
}

/* Boot: all sprites and backdrops are generated procedurally in code. */
class Boot extends Phaser.Scene {
  constructor() { super('Boot'); }
  create() {
    const g = this.make.graphics({ add: false });
    for (let y = 0; y < H; y += 8) {
      const t = y / H;
      g.fillStyle(Phaser.Display.Color.GetColor(Math.floor(10 + t * 26), Math.floor(12 + t * 14), Math.floor(38 + t * 50)), 1);
      g.fillRect(0, y, W, 8);
    }
    g.generateTexture('bg', W, H); g.clear();
    [['dust1', 60, 1.8, 0.8], ['dust2', 110, 1.1, 0.4]].forEach(([k, n, r, a]) => {
      for (let i = 0; i < n; i++) {
        g.fillStyle(0xffffff, Phaser.Math.FloatBetween(a * 0.4, a));
        g.fillCircle(Phaser.Math.Between(0, 512), Phaser.Math.Between(0, 512), Phaser.Math.FloatBetween(r * 0.5, r));
      }
      g.generateTexture(k, 512, 512); g.clear();
    });

    g.fillStyle(0x7ee8d0, 0.2).fillCircle(24, 24, 22);
    g.fillStyle(0x7ee8d0, 1).fillCircle(24, 24, 12);
    g.fillStyle(0x0b1020, 1).fillCircle(24, 24, 5);
    g.generateTexture('player', 48, 48); g.clear();

    g.fillStyle(0xffc857, 1).fillPoints(spikes(18, 18, 5, 16, 7), true);
    g.generateTexture('star', 36, 36); g.clear();

    g.fillStyle(0xff6b5e, 1).fillPoints(spikes(22, 22, 8, 21, 12), true);
    g.fillStyle(0x2a0f18, 1).fillCircle(22, 22, 7).fillStyle(0xffd0c8, 1).fillCircle(22, 22, 3);
    g.generateTexture('enemy', 44, 44); g.clear();

    g.fillStyle(0xc77dff, 1).fillPoints(spikes(22, 22, 6, 21, 10), true);
    g.fillStyle(0x1d0b2e, 1).fillCircle(22, 22, 8).fillStyle(0xff5ca8, 1).fillCircle(22, 22, 4);
    g.generateTexture('hunter', 44, 44); g.clear();

    g.fillStyle(0x4aa8ff, 1).fillCircle(18, 18, 15).lineStyle(3, 0xffffff, 1).strokeCircle(18, 18, 9);
    g.generateTexture('shield', 36, 36); g.clear();

    g.fillStyle(0xb7e4ff, 1).fillPoints(spikes(18, 18, 6, 16, 16), true).fillStyle(0xffffff, 1).fillCircle(18, 18, 5);
    g.generateTexture('freeze', 36, 36); g.clear();

    g.fillStyle(0x4aa8ff, 0.15).fillCircle(28, 28, 26).lineStyle(3, 0x8fc8ff, 1).strokeCircle(28, 28, 26);
    g.generateTexture('ring', 56, 56); g.clear();

    g.fillStyle(0xffffff, 1).fillCircle(4, 4, 4);
    g.generateTexture('spark', 8, 8); g.clear();
    g.fillStyle(0xff3d6e, 1).fillPoints(spikes(64, 64, 12, 62, 44), true);
    g.fillStyle(0x2a0f18, 1).fillCircle(64, 64, 30).fillStyle(0xffc857, 1).fillCircle(64, 64, 16).fillStyle(0x2a0f18, 1).fillCircle(64, 64, 7);
    g.generateTexture('boss', 128, 128); g.clear();
    g.fillStyle(0xff6b5e, 0.35).fillCircle(9, 9, 9).fillStyle(0xffd0c8, 1).fillCircle(9, 9, 5);
    g.generateTexture('bullet', 18, 18);
    g.destroy();
    this.scene.start('Menu');
  }
}

class Menu extends Phaser.Scene {
  constructor() { super('Menu'); }
  create() {
    this.add.image(W / 2, H / 2, 'bg');
    this.d1 = this.add.tileSprite(W / 2, H / 2, W, H, 'dust1');
    this.d2 = this.add.tileSprite(W / 2, H / 2, W, H, 'dust2');
    const orb = this.add.image(W / 2, 230, 'player').setScale(2.4);
    this.tweens.add({ targets: orb, y: 250, yoyo: true, repeat: -1, duration: 1400, ease: 'Sine.inOut' });
    [['star', 150, 300], ['enemy', 450, 200], ['hunter', 480, 330], ['shield', 120, 190]].forEach(([k, x, y], i) =>
      this.tweens.add({ targets: this.add.image(x, y, k), y: y + 16, yoyo: true, repeat: -1, duration: 1100 + i * 250, ease: 'Sine.inOut' }));
    this.add.text(W / 2, 370, 'Starlight Drift', { fontFamily: FONT, fontSize: '54px', fontStyle: 'bold', color: '#e8f0ff' }).setOrigin(0.5);
    this.add.text(W / 2, 430, 'Chain stars for combos. Dash through danger.', { fontFamily: FONT, fontSize: '21px', color: '#9fb0d9' }).setOrigin(0.5);
    this.add.text(W / 2, 480, 'Orange drones bounce. Purple hunters chase you.', { fontFamily: FONT, fontSize: '19px', color: '#c77dff' }).setOrigin(0.5);
    const go = this.add.text(W / 2, 580, 'Tap, click or press Space to start', { fontFamily: FONT, fontSize: '24px', color: '#ffc857' }).setOrigin(0.5);
    this.tweens.add({ targets: go, alpha: 0.35, yoyo: true, repeat: -1, duration: 800 });
    const top = loadTop();
    this.add.text(W / 2, 650, top.length ? 'Top scores: ' + top.slice(0, 3).join('   ') : 'No scores yet. Set the first one!', { fontFamily: FONT, fontSize: '20px', color: '#7ee8d0' }).setOrigin(0.5);
    const start = () => { sfx(523, 0.15, 'triangle', 400); this.scene.start('Play'); };
    this.input.once('pointerdown', start);
    this.input.keyboard.once('keydown-SPACE', start);
  }
  update() { this.d1.tilePositionY -= 0.6; this.d2.tilePositionY -= 0.25; }
}

class Play extends Phaser.Scene {
  constructor() { super('Play'); }
  create() {
    this.add.image(W / 2, H / 2, 'bg');
    this.d1 = this.add.tileSprite(W / 2, H / 2, W, H, 'dust1');
    this.d2 = this.add.tileSprite(W / 2, H / 2, W, H, 'dust2');
    Object.assign(this, { score: 0, lives: 3, level: 1, got: 0, combo: 1, lastStar: 0, safe: false, over: false,
      dashing: false, dashReady: true, shield: false, frozen: false, step: 0, best0: loadBest(), paused: false, boss: null });
    this.best = this.best0;
    this.dir = new Phaser.Math.Vector2(0, -1);

    this.stars = this.physics.add.group();
    this.foes = this.physics.add.group();
    this.powers = this.physics.add.group();
    this.shots = this.physics.add.group();
    this.bossGrp = this.physics.add.group();
    this.player = this.physics.add.image(W / 2, H * 0.8, 'player').setCollideWorldBounds(true).setCircle(10, 14, 14).setDepth(5);
    this.ring = this.add.image(0, 0, 'ring').setDepth(6).setVisible(false);

    this.add.particles(0, 0, 'spark', { follow: this.player, speed: { min: 5, max: 25 }, lifespan: 450,
      scale: { start: 1, end: 0 }, alpha: { start: 0.6, end: 0 }, frequency: 40, tint: 0x7ee8d0 });
    const burst = (tint, lo, hi) => this.add.particles(0, 0, 'spark', { speed: { min: lo, max: hi }, lifespan: 550, scale: { start: 1.8, end: 0 }, tint, emitting: false }).setDepth(7);
    this.gold = burst(0xffc857, 80, 220); this.red = burst(0xff6b5e, 100, 260); this.blue = burst(0x4aa8ff, 90, 240);

    const T = { fontFamily: FONT, fontSize: '22px', color: '#dfe8ff' };
    this.hud = this.add.text(16, 14, '', T).setDepth(10);
    this.comboTxt = this.add.text(16, 74, '', { ...T, color: '#ffc857', fontStyle: 'bold' }).setDepth(10);
    this.hudR = this.add.text(W - 16, 14, '', { ...T, color: '#7ee8d0' }).setOrigin(1, 0).setDepth(10);
    this.bar = this.add.graphics().setDepth(10);
    this.bb = this.add.graphics().setDepth(10);
    this.pauseTxt = this.add.text(W / 2 + 45, 14, '❚❚', { ...T, fontSize: '18px', color: '#9fb0d9' }).setOrigin(0.5, 0).setDepth(10).setInteractive().on('pointerdown', () => this.togglePause());
    this.muteTxt = this.add.text(W / 2 - 45, 14, muted ? '♪ off' : '♪ on', { ...T, fontSize: '18px', color: '#9fb0d9' }).setOrigin(0.5, 0).setDepth(10).setInteractive()
      .on('pointerdown', () => this.toggleMute());

    this.btn = this.add.circle(W - 70, H - 90, 44, 0x7ee8d0, 0.18).setStrokeStyle(3, 0x7ee8d0).setDepth(10).setInteractive()
      .on('pointerdown', () => this.dash());
    this.btnTxt = this.add.text(W - 70, H - 90, 'DASH', { fontFamily: FONT, fontSize: '18px', fontStyle: 'bold', color: '#7ee8d0' }).setOrigin(0.5).setDepth(11);

    this.cur = this.input.keyboard.createCursorKeys();
    this.keys = this.input.keyboard.addKeys('W,A,S,D');
    this.input.keyboard.on('keydown-SPACE', () => this.dash());
    this.input.keyboard.on('keydown-M', () => this.toggleMute());
    this.input.keyboard.on('keydown-P', () => this.togglePause());
    this.input.keyboard.on('keydown-ESC', () => this.togglePause());

    this.physics.add.overlap(this.player, this.stars, (p, s) => this.collect(s));
    this.physics.add.overlap(this.player, this.powers, (p, o) => this.power(o));
    this.physics.add.overlap(this.player, this.foes, () => this.hit());
    this.physics.add.overlap(this.player, this.shots, (p, s) => { s.destroy(); this.hit(); });
    this.physics.add.overlap(this.player, this.bossGrp, (p, b) => this.bossTouch(b));

    for (let i = 0; i < 3; i++) this.spawnStar();
    for (let i = 0; i < 2; i++) this.spawnFoe();
    this.time.addEvent({ delay: 9000, loop: true, callback: () => this.spawnPower() });
    this.time.addEvent({ delay: 480, loop: true, callback: () => { if (!this.over) sfx(NOTES[this.step++ % NOTES.length] / 2, 0.45, 'triangle', 0, 0.02); } });
    this.refreshHud();
    this.banner('Level 1', '#ffc857');
    if (!loadTop().length) {
      const tip = this.add.text(W / 2, H - 170, 'Drag or use arrows to move\nCollect stars, avoid drones\nDash (Space or button) makes you untouchable for a moment', { fontFamily: FONT, fontSize: '18px', color: '#9fb0d9', align: 'center' }).setOrigin(0.5).setDepth(12);
      this.tweens.add({ targets: tip, alpha: 0, delay: 5000, duration: 800, onComplete: () => tip.destroy() });
    }
    const hide = () => { if (!this.paused && !this.over) this.togglePause(); };
    this.game.events.on(Phaser.Core.Events.HIDDEN, hide);
    this.events.once('shutdown', () => this.game.events.off(Phaser.Core.Events.HIDDEN, hide));
  }

  target() { return 4 + this.level * 2; }
  onUI(q) { return Phaser.Math.Distance.Between(q.x, q.y, this.btn.x, this.btn.y) < 60 || (q.y < 50 && Math.abs(q.x - W / 2) < 110); }
  toggleMute() { muted = !muted; this.muteTxt.setText(muted ? '♪ off' : '♪ on'); }

  togglePause() {
    if (this.over) return;
    this.paused = !this.paused;
    if (this.paused) {
      this.physics.pause(); this.tweens.pauseAll(); this.time.paused = true;
      this.pauseUI = [this.add.rectangle(W / 2, H / 2, W, H, 0x070b18, 0.7).setDepth(30),
        this.add.text(W / 2, H / 2 - 20, 'Paused', { fontFamily: FONT, fontSize: '52px', fontStyle: 'bold', color: '#e8f0ff' }).setOrigin(0.5).setDepth(31),
        this.add.text(W / 2, H / 2 + 40, 'Press P or tap ❚❚ to resume', { fontFamily: FONT, fontSize: '20px', color: '#9fb0d9' }).setOrigin(0.5).setDepth(31)];
    } else {
      this.pauseUI.forEach(o => o.destroy());
      this.physics.resume(); this.tweens.resumeAll(); this.time.paused = false;
    }
  }

  startBoss() {
    const b = this.bossGrp.create(110, -80, 'boss').setCircle(52, 12, 12).setImmovable(true).setDepth(4);
    b.hp = b.max = Math.round(4 + this.level / 2); b.hitAt = 0;
    this.boss = b;
    this.time.delayedCall(900, () => this.banner('Boss!', '#ff3d6e'));
    sfx(110, 0.6, 'sawtooth', 60, 0.09);
    this.tweens.add({ targets: b, y: 160, duration: 1200, ease: 'Back.out', onComplete: () => {
      this.tweens.add({ targets: b, x: W - 110, yoyo: true, repeat: -1, duration: 2600, ease: 'Sine.inOut' });
    } });
    this.bossEv = this.time.addEvent({ delay: 1700, loop: true, callback: () => this.bossFire() });
  }

  bossFire() {
    const b = this.boss;
    if (!b || !b.active || this.over) return;
    const n = 10, off = Math.random() * 6.28, sp = 140 + this.level * 4;
    for (let i = 0; i < n; i++) this.shot(b.x, b.y, off + (i / n) * 6.28, sp);
    if (b.hp <= b.max / 2) this.shot(b.x, b.y, Phaser.Math.Angle.Between(b.x, b.y, this.player.x, this.player.y), sp * 1.5);
    sfx(180, 0.15, 'square', -60, 0.05);
  }

  shot(x, y, a, sp) {
    const s = this.shots.create(x, y, 'bullet').setCircle(5, 4, 4).setDepth(4);
    s.setVelocity(Math.cos(a) * sp, Math.sin(a) * sp);
    this.time.delayedCall(5000, () => s.destroy());
  }

  bossTouch(b) {
    if (!this.dashing) return this.hit();
    if (this.time.now - b.hitAt < 500) return;
    b.hitAt = this.time.now; b.hp--;
    this.red.explode(20, b.x, b.y);
    this.cameras.main.shake(160, 0.01);
    sfx(260, 0.2, 'square', 200, 0.08);
    b.setTint(0xffffff); this.time.delayedCall(120, () => { if (b.active) b.clearTint(); });
    this.float(b.x, b.y - 70, 'Hit!', '#ffc857');
    if (b.hp <= 0) this.bossDown(b);
  }

  bossDown(b) {
    const bx = b.x, by = b.y;
    this.bossEv.remove(); this.boss = null;
    this.shots.clear(true, true);
    for (let i = 0; i < 6; i++) this.time.delayedCall(i * 90, () => this.red.explode(20, bx + Phaser.Math.Between(-40, 40), by + Phaser.Math.Between(-40, 40)));
    this.tweens.killTweensOf(b); b.destroy();
    this.score += 500; if (this.score > this.best) this.best = this.score;
    this.float(W / 2, 260, '+500 Boss down!', '#ff8fa3');
    sfx(90, 0.9, 'sawtooth', 500, 0.1);
    this.levelUp();
  }

  farPoint(minDist) {
    let x, y;
    do { x = Phaser.Math.Between(40, W - 40); y = Phaser.Math.Between(100, H - 40); }
    while (Phaser.Math.Distance.Between(x, y, this.player.x, this.player.y) < minDist);
    return { x, y };
  }

  spawnStar() {
    const { x, y } = this.farPoint(120);
    const s = this.stars.create(x, y, 'star').setCircle(12, 6, 6);
    this.tweens.add({ targets: s, scale: 1.2, yoyo: true, repeat: -1, duration: 700, ease: 'Sine.inOut' });
    this.tweens.add({ targets: s, angle: 360, repeat: -1, duration: 4000 });
  }

  spawnFoe(hunter) {
    const { x, y } = this.farPoint(250);
    const f = this.foes.create(x, y, hunter ? 'hunter' : 'enemy').setCircle(14, 8, 8).setBounce(1).setCollideWorldBounds(true);
    f.hunter = !!hunter;
    const a = Phaser.Math.FloatBetween(0, 6.28), sp = (hunter ? 50 : 90 + this.level * 16) * (this.frozen ? 0.25 : 1);
    f.setVelocity(Math.cos(a) * sp, Math.sin(a) * sp);
    if (hunter) f.setMaxVelocity(110 + this.level * 6);
    if (this.frozen) f.setTint(0x88aaff);
    this.tweens.add({ targets: f, angle: 360, repeat: -1, duration: hunter ? 1800 : 2600 });
  }

  spawnPower() {
    if (this.over) return;
    const k = Math.random() < 0.5 ? 'shield' : 'freeze', { x, y } = this.farPoint(100);
    const o = this.powers.create(x, y, k).setCircle(14, 4, 4);
    o.kind = k;
    this.tweens.add({ targets: o, scale: 1.25, yoyo: true, repeat: -1, duration: 500 });
    this.time.delayedCall(8000, () => { if (o.active) this.tweens.add({ targets: o, alpha: 0, duration: 400, onComplete: () => o.destroy() }); });
  }

  collect(s) {
    const now = this.time.now;
    this.combo = now - this.lastStar < 2200 ? Math.min(this.combo + 1, 5) : 1;
    this.lastStar = now;
    const pts = 10 * this.level * this.combo;
    this.score += pts; this.got++;
    if (this.score > this.best) this.best = this.score;
    this.gold.explode(12, s.x, s.y);
    this.float(s.x, s.y - 20, '+' + pts + (this.combo > 1 ? ' x' + this.combo : ''), '#ffc857');
    sfx(480 + this.combo * 110, 0.14, 'triangle', 300);
    s.destroy();
    this.spawnStar();
    if (!this.boss && this.got >= this.target()) this.levelUp();
    this.refreshHud();
  }

  power(o) {
    this.blue.explode(14, o.x, o.y);
    if (o.kind === 'shield') { this.shield = true; this.float(o.x, o.y - 20, 'Shield!', '#8fc8ff'); sfx(600, 0.25, 'sine', 500); }
    else { this.freeze(); this.float(o.x, o.y - 20, 'Freeze!', '#b7e4ff'); sfx(900, 0.3, 'sine', -600); }
    o.destroy();
  }

  freeze() {
    if (this.frozen) this.freezeEv.remove();
    else {
      this.frozen = true;
      this.foes.children.each(f => { f.body.velocity.scale(0.25); f.setTint(0x88aaff); });
    }
    this.freezeEv = this.time.delayedCall(5000, () => {
      this.frozen = false;
      this.foes.children.each(f => { f.body.velocity.scale(4); f.clearTint(); });
    });
  }

  dash() {
    if (!this.dashReady || this.over || this.paused) return;
    this.dashReady = false; this.dashing = true;
    this.player.setVelocity(this.dir.x * 760, this.dir.y * 760);
    this.player.setTint(0x7ee8d0);
    this.cameras.main.shake(120, 0.004);
    sfx(300, 0.2, 'sawtooth', 500, 0.05);
    this.time.delayedCall(190, () => { this.dashing = false; this.player.clearTint(); });
    this.time.delayedCall(1800, () => { this.dashReady = true; sfx(700, 0.06, 'sine', 0, 0.04); });
  }

  levelUp() {
    this.level++; this.got = 0;
    if (this.level % 5 === 0) this.startBoss(); else if (this.level % 2 === 1) this.spawnFoe(true); else this.spawnFoe();
    this.foes.children.each(f => { if (!f.hunter) f.body.velocity.scale(1.08).limit(320); });
    this.cameras.main.flash(300, 126, 232, 208);
    [523, 659, 784].forEach((f, i) => this.time.delayedCall(i * 90, () => sfx(f, 0.18, 'triangle')));
    this.banner('Level ' + this.level, '#ffc857');
    if (this.level % 3 === 0 && this.lives < 5) { this.lives++; this.float(this.player.x, this.player.y - 40, '+1 life', '#ff8fa3'); }
  }

  hit() {
    if (this.safe || this.over || this.dashing) return;
    this.safe = true;
    this.cameras.main.shake(220, 0.012);
    try { if (navigator.vibrate) navigator.vibrate(60); } catch (e) {}
    if (this.shield) {
      this.shield = false;
      this.blue.explode(20, this.player.x, this.player.y);
      sfx(200, 0.25, 'square', -100);
      this.time.delayedCall(700, () => { this.safe = false; });
      return;
    }
    this.lives--; this.combo = 1;
    this.red.explode(18, this.player.x, this.player.y);
    sfx(160, 0.35, 'sawtooth', -110, 0.09);
    this.tweens.add({ targets: this.player, alpha: 0.25, yoyo: true, repeat: 5, duration: 120, onComplete: () => { this.player.setAlpha(1); this.safe = false; } });
    this.refreshHud();
    if (this.lives <= 0) this.gameOver();
  }

  gameOver() {
    this.over = true;
    this.physics.pause();
    this.player.setAlpha(1);
    saveBest(this.best);
    const rank = this.score > 0 ? addTop(this.score) : 0;
    sfx(220, 0.8, 'sawtooth', -150, 0.09);
    this.add.rectangle(W / 2, H / 2, W, H, 0x070b18, 0.72).setDepth(20);
    const C = (y, s, size, color, bold) => this.add.text(W / 2, y, s, { fontFamily: FONT, fontSize: size, color, fontStyle: bold ? 'bold' : 'normal' }).setOrigin(0.5).setDepth(21);
    C(310, 'Game over', '52px', '#ff6b5e', true);
    C(385, 'Score ' + this.score + '   Level ' + this.level, '26px', '#e8f0ff');
    C(432, this.score > this.best0 ? 'New best!' : 'Best ' + this.best, '24px', '#7ee8d0', this.score > this.best0);
    C(472, rank ? 'Rank #' + rank + ' on this device' : '', '18px', '#9fb0d9');
    const t = C(520, 'Tap or press Space to play again', '22px', '#ffc857');
    this.tweens.add({ targets: t, alpha: 0.35, yoyo: true, repeat: -1, duration: 800 });
    this.time.delayedCall(700, () => {
      const again = () => this.scene.restart();
      this.input.once('pointerdown', again);
      this.input.keyboard.once('keydown-SPACE', again);
    });
  }

  banner(msg, color) {
    const t = this.add.text(W / 2, 300, msg, { fontFamily: FONT, fontSize: '56px', fontStyle: 'bold', color }).setOrigin(0.5).setDepth(15);
    this.tweens.add({ targets: t, y: 250, alpha: 0, duration: 1400, delay: 300, onComplete: () => t.destroy() });
  }

  float(x, y, msg, color) {
    const t = this.add.text(x, y, msg, { fontFamily: FONT, fontSize: '22px', fontStyle: 'bold', color }).setOrigin(0.5).setDepth(15);
    this.tweens.add({ targets: t, y: y - 40, alpha: 0, duration: 800, onComplete: () => t.destroy() });
  }

  refreshHud() {
    this.hud.setText('Score ' + this.score + '\nLives ' + '♥'.repeat(Math.max(this.lives, 0)));
    this.hudR.setText('Level ' + this.level + '\nBest ' + this.best);
    this.comboTxt.setText(this.combo > 1 ? 'Combo x' + this.combo : '');
    const w = 160, pct = Math.min(this.got / this.target(), 1);
    this.bar.clear().fillStyle(0xffffff, 0.15).fillRoundedRect(W - 16 - w, 70, w, 10, 5).fillStyle(0xffc857, 1).fillRoundedRect(W - 16 - w, 70, Math.max(w * pct, 0), 10, 5);
  }

  update() {
    this.d1.tilePositionY -= 0.5 + this.level * 0.05;
    this.d2.tilePositionY -= 0.2;
    if (this.over) return;
    if (this.paused) return;
    const p = this.player, c = this.cur, k = this.keys, sp = 300;
    this.bb.clear();
    if (this.boss) {
      const bw = 300, f = Math.max(this.boss.hp / this.boss.max, 0);
      this.bb.fillStyle(0xffffff, 0.15).fillRoundedRect(W / 2 - bw / 2, 104, bw, 12, 6).fillStyle(0xff3d6e, 1).fillRoundedRect(W / 2 - bw / 2, 104, bw * f, 12, 6);
    }
    this.btn.setAlpha(this.dashReady ? 1 : 0.3); this.btnTxt.setAlpha(this.dashReady ? 1 : 0.4);
    this.ring.setPosition(p.x, p.y).setVisible(this.shield);
    if (this.combo > 1 && this.time.now - this.lastStar > 2200) { this.combo = 1; this.refreshHud(); }
    if (!this.frozen) this.foes.children.each(f => { if (f.hunter) this.physics.accelerateToObject(f, p, 95); });

    if (this.dashing) {
      // The existing player-following particle emitter supplies the dash trail.
      // Avoid allocating a new image and tween on every frame.
      return;
    }
    let vx = 0, vy = 0;
    if (c.left.isDown || k.A.isDown) vx--;
    if (c.right.isDown || k.D.isDown) vx++;
    if (c.up.isDown || k.W.isDown) vy--;
    if (c.down.isDown || k.S.isDown) vy++;
    const ptr = [this.input.mousePointer, this.input.pointer1, this.input.pointer2].find(q => q && q.isDown && !this.onUI(q));
    if (vx || vy) {
      this.dir.set(vx, vy).normalize();
      p.setVelocity(this.dir.x * sp, this.dir.y * sp);
    } else if (ptr && Phaser.Math.Distance.Between(p.x, p.y, ptr.worldX, ptr.worldY) > 10) {
      this.dir.set(ptr.worldX - p.x, ptr.worldY - p.y).normalize();
      this.physics.moveTo(p, ptr.worldX, ptr.worldY, sp);
    } else p.setVelocity(0);
  }
}

new Phaser.Game({
  type: Phaser.AUTO,
  parent: 'game',
  width: W,
  height: H,
  backgroundColor: '#0a0e28',
  physics: { default: 'arcade', arcade: { debug: false } },
  scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
  input: { activePointers: 2 },
  scene: [Boot, Menu, Play]
});
</script>
</body>
